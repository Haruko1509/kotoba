<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="condCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldBraid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="condSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Blue Night Mist -->
  <ellipse cx="160" cy="240" rx="140" ry="200" fill="#38BDF8" opacity="0.08" filter="blur(20px)"/>

  <!-- Body: Black Formal Railway Uniform with Gold Buttons -->
  <path d="M65 310 C 65 260, 105 250, 160 250 C 215 250, 255 260, 255 310 L 270 480 L 50 480 Z" fill="url(#condCoat)"/>
  
  <!-- Golden Epaulets (Vai áo quân phục) -->
  <rect x="65" y="270" width="45" height="14" rx="4" fill="url(#goldBraid)"/>
  <rect x="210" y="270" width="45" height="14" rx="4" fill="url(#goldBraid)"/>

  <!-- Double Breasted Golden Buttons -->
  <circle cx="140" cy="340" r="6" fill="url(#goldBraid)"/>
  <circle cx="180" cy="340" r="6" fill="url(#goldBraid)"/>
  <circle cx="140" cy="380" r="6" fill="url(#goldBraid)"/>
  <circle cx="180" cy="380" r="6" fill="url(#goldBraid)"/>
  <circle cx="140" cy="420" r="6" fill="url(#goldBraid)"/>
  <circle cx="180" cy="420" r="6" fill="url(#goldBraid)"/>

  <!-- Crisp White Shirt & Stiff Black Tie -->
  <polygon points="160,255 135,310 185,310" fill="#F8FAFC"/>
  <polygon points="160,270 152,350 168,350" fill="#0F172A"/>

  <!-- Neck -->
  <rect x="144" y="210" width="32" height="45" fill="url(#condSkin)"/>

  <!-- Face / Chin -->
  <path d="M110 150 C 110 220, 132 245, 160 245 C 188 245, 210 220, 210 150 C 210 100, 110 100, 110 150 Z" fill="url(#condSkin)"/>

  <!-- Polite Conductor Eyes (Smiling gently) -->
  <path d="M125 160 Q 138 152, 150 162" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M170 162 Q 182 152, 195 160" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Polite Smile -->
  <path d="M148 198 Q 160 206, 172 198" stroke="#9A3412" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Hair -->
  <path d="M102 145 C 90 90, 125 60, 160 60 C 195 60, 230 90, 218 145 Z" fill="#334155"/>

  <!-- Conductor Visor Cap (Mũ trưởng tàu ngân hà) -->
  <path d="M90 105 C 95 40, 225 40, 230 105 Z" fill="#0F172A"/>
  <!-- Visor Brim -->
  <path d="M80 105 C 80 100, 240 100, 240 105 L 225 120 C 160 114, 160 114, 95 120 Z" fill="#020617"/>
  <!-- Gold Cap Band & Insignia -->
  <rect x="92" y="96" width="136" height="10" fill="url(#goldBraid)"/>
  <!-- Galaxy Crest on Cap -->
  <circle cx="160" cy="80" r="10" fill="url(#goldBraid)"/>
  <circle cx="160" cy="80" r="6" fill="#0F172A"/>
  <polygon points="160,74 162,78 166,80 162,82 160,86 158,82 154,80 158,78" fill="#FEF08A"/>
</svg>
